name: bahay_rent
description: Offline rental management and billing for Philippine properties.
publish_to: none
version: 1.0.0+1
environment:
  sdk: '>=3.12.0 <4.0.0'
dependencies:
  flutter:
    sdk: flutter
  sqflite: ^2.4.2
  path: ^1.9.1
  path_provider: ^2.1.5
  intl: ^0.20.2
  pdf: ^3.11.3
  printing: ^5.14.2
  # image 4.11.0 advertises an archive constraint its PNG implementation cannot use.
  # Keep this compatible version while notifications 19.x needs xml 6 / pdf 3.12.
  image: 4.8.0
  file_picker: ^10.3.10
  share_plus: ^12.0.2
  flutter_local_notifications: ^19.5.0
  timezone: ^0.10.1
  flutter_secure_storage: ^9.2.4
  local_auth: ^2.3.0
  cryptography: ^2.7.0
  uuid: ^4.5.2
dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  sqflite_common_ffi: ^2.3.6
flutter:
  uses-material-design: true
  assets:
    - assets/fonts/
